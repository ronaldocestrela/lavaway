            width: 100%;
            height: 8px;
            background: #0f1f1d;
            border-radius: 999px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .loading-meter-fill {
            height: 100%;
            width: var(--blazor-load-percentage, 0%);
            min-width: 6%;
            background: linear-gradient(90deg, #256b57 0%, #90e0b3 50%, #c6f277 100%);

            box-shadow: 0 0 12px rgba(198, 242, 119, 0.5);
            position: relative;
            transition: width 0.15s ease-out;

        .loading-meter-fill::after {

            color: #c6f277;
            text-decoration: underline;
        }
